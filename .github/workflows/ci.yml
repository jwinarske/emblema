# Verification on a runner with no GPU.
#
# The obvious objection to CI here is that this is a renderer and a hosted
# runner has no graphics hardware, so a green run would mean nothing. That was
# worth checking rather than assuming, and it is false: Mesa ships conformant
# CPU implementations of both APIs this project targets -- lavapipe for Vulkan
# and llvmpipe for GLES -- and the whole suite runs on them. It is not a
# reduced mode. lavapipe offers advanced blending, which the discrete part this
# was developed against does not, so the runner covers scenes that the
# workstation reports as unavailable.
#
# What it cannot cover is real hardware behavior and KMS: there is no display
# controller to become master of, so the scanout tests skip. Those need a
# machine with a GPU and a free connector, which is a separate runner rather
# than something to fake here.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded push has nothing to say, and the full run is not cheap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify (software rendering)
    runs-on: ubuntu-latest
    # The whole job takes a few minutes when nothing is wrong. A cap turns a
    # hung step into a failure somebody sees rather than an hour of a runner
    # sitting on it -- which is not hypothetical: this was added after watching
    # `apt-get` stall for ten minutes on a step that normally takes twenty
    # seconds, with nothing to say how long it intended to keep trying.
    timeout-minutes: 30
    env:
      # Scoped to this job rather than the workflow: the other one builds
      # cargo-deny from source, and denying warnings there would fail this
      # repository's CI over a warning in somebody else's crate.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      # The runner ships with several toolchains this repository never uses,
      # and they are large enough to decide whether the job finishes. It ran
      # out of disk on 2026-09-02 -- every step green, the suite passed, and
      # the runner then died packing the cargo cache, which needs room for a
      # copy of what it is packing. The failure surfaced as a job with no
      # failing step and two post-steps that never reported, which is not a
      # shape anybody reads correctly the first time.
      #
      # Removed before the cache is restored rather than after, since the
      # restore needs the room too. `|| true` throughout: a runner image that
      # stops shipping one of these should not fail the build for it.
      - name: Make room
        run: |
          before=$(df --output=avail -BG / | tail -1)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          echo "free before: $before, after: $(df --output=avail -BG / | tail -1)"

      - name: Install Mesa
        # Wrapped in a hard wall-clock cap and retried, because apt's own
        # timeout is the wrong instrument. It measures inactivity, and the
        # failure here is a mirror that answers and then transfers slowly --
        # never idle, never finished. Setting Acquire::Timeout was the previous
        # attempt at this and a run stalled twelve minutes through it, which is
        # how I know. `timeout` does not care why it is slow.
        #
        # Three attempts, because a fresh apt run generally picks a different
        # mirror. The job cap remains the backstop for the case where all three
        # are slow.
        env:
          APT_OPTS: >-
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o Acquire::Retries=2
        run: |
          # libvulkan1 is the loader ash opens; mesa-vulkan-drivers carries the
          # lavapipe ICD it then finds. libegl1 is what khronos-egl dlopens,
          # and the DRI package is where llvmpipe itself lives -- without it
          # EGL initializes and reports no usable config.
          packages="libvulkan1 mesa-vulkan-drivers vulkan-validationlayers"
          packages="$packages libegl1 libgles2 libgbm1 libdrm2 libgl1-mesa-dri"
          # The index first, and only if it is needed. The runner image ships
          # with a populated apt index, so the common case needs no fetch at
          # all -- and fetching it was the slowest thing in this step and on
          # the critical path of every attempt, which is why three attempts
          # could all run out of time on a slow mirror.
          if timeout 300 sudo apt-get $APT_OPTS install -y \
               --no-install-recommends $packages; then
            echo "installed from the image's own index"
            exit 0
          fi
          echo "the shipped index was not enough; refreshing it"
          for attempt in 1 2 3; do
            if timeout 200 sudo apt-get $APT_OPTS update \
              && timeout 300 sudo apt-get $APT_OPTS install -y \
                   --no-install-recommends $packages; then
              echo "installed on attempt $attempt after a refresh"
              exit 0
            fi
            echo "attempt $attempt was too slow or failed; trying again"
            sleep 5
          done
          echo "apt did not finish after three refreshes"
          exit 1

      # v6 and v7 across the three: the majors this skipped when it moved off
      # the Node 20 runtime, taken now that the runtime change has run green on
      # its own. Each carries a behavior change and none of them reaches this
      # workflow -- `cache` and `upload-artifact` migrated to ESM,
      # `upload-artifact` added an opt-in unzipped upload this does not ask for,
      # `checkout` persists credentials to a separate file, and `checkout@v7`
      # refuses to check a fork out for `pull_request_target` and
      # `workflow_run`, neither of which triggers this.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Select the software implementations
        run: |
          # Found rather than hardcoded. The first version of this step named
          # the path lavapipe has on Fedora, which is not the path it has here,
          # and a distribution's ICD filename is exactly the kind of thing to
          # discover instead of assume. The directory is listed either way, so
          # a future mismatch is diagnosable from the log rather than from a
          # second push.
          ls -la /usr/share/vulkan/icd.d/ || true
          icd=$(ls /usr/share/vulkan/icd.d/*lvp*.json 2>/dev/null | head -1)
          if [ -z "$icd" ]; then
            echo "no lavapipe ICD found; the listing above is what was installed"
            exit 1
          fi
          # Pinned once found, so the run cannot quietly pick up something else
          # and a packaging change is a failure here rather than a suite that
          # skips its way to green.
          echo "using $icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"

      - name: Report devices
        run: |
          # Every device test in this suite skips when it cannot find a device,
          # and a skip passes. Without this step a runner that installed no
          # working driver would go green having rendered nothing at all, which
          # is the one CI result worse than a red one. So the devices are
          # printed, and their absence is a failure.
          mkdir -p target
          cargo xtask report | tee target/devices.txt
          grep -q '^vulkan:' target/devices.txt || { echo "no Vulkan device"; exit 1; }
          grep -q '^gles'    target/devices.txt || { echo "no GLES device"; exit 1; }
          # The validation layer is the other thing whose absence is invisible.
          # The first run of this workflow skipped eighty tests for want of it
          # and still reported every one of them as passing, which is the same
          # trap as a missing driver one level down.
          test -f /usr/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json \
            || { echo "validation layer missing; 80 tests would skip silently"; exit 1; }

      - name: Smoke
        run: ./ci/smoke.sh

      # The census is a summary, and a failure on a machine nobody can log into
      # is exactly where a summary runs out. This is the harness's whole output,
      # kept whether or not anything parsed it.
      - name: Keep the test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-log
          path: |
            target/verify.log
            target/devices.txt
          if-no-files-found: warn

  msrv:
    name: minimum supported toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Read from the manifest rather than written twice. A job that pinned its
      # own version would keep passing after somebody raised the declared one,
      # which is the failure mode this job exists to prevent.
      - name: Read the declared version
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          test -n "$version" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared MSRV is $version"
      - name: Install it
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      # `--locked`, because the claim is about this dependency set: a resolution
      # that drifts to a newer crate is exactly how 1.82 stopped being true.
      # No warning denial here -- an older compiler warns about different things,
      # and this job is about whether the code compiles, not how tidily.
      - name: Check
        run: |
          rustup run ${{ steps.msrv.outputs.version }} \
            cargo check --workspace --all-targets --locked

  cross:
    name: cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      # `check` rather than `build`, deliberately: linking would want a cross
      # linker and C runtime for the target, and needing neither is the claim.
      # If a dependency ever starts compiling C, this stops being about the
      # linker and starts failing here, which is the point.
      #
      # Every axis at once, because that compiles the most code and is what a
      # board actually enables. The presentation features are named here too:
      # one of them enabled nothing for as long as it existed, and a check that
      # never turns a feature on cannot notice that turning it on does nothing.
      - name: Check
        run: |
          cargo check -p emblema --no-default-features \
            --features vulkan,gles,drm,present-wsi,present-egl \
            --target ${{ matrix.target }} --locked

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo-deny
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}
      - name: Install cargo-deny
        run: command -v cargo-deny || cargo install cargo-deny --locked
      # Separate from the build because the bans are a design constraint rather
      # than a lint: this workspace must compile from pure Rust source, with no
      # C toolchain, cmake or pkg-config, because that property is what keeps
      # cross-compiling to aarch64 and riscv64 boards trivial. Nothing in a
      # normal build notices when a dependency bump breaks it.
      - name: Check bans, licenses, advisories and sources
        run: cargo deny check
