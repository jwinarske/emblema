# A library must not end its caller's process, so `unwrap`, `panic!`, `todo!`
# and `unimplemented!` are denied at the workspace root. A test is not a
# library: a failed assumption there *should* stop the run, and writing
# `expect` around every setup step would bury what each test is about.
#
# These four settings scope the denial to what ships. A build script is the
# same case and cannot be covered here, so `emblema-shaders/build.rs` carries
# its own allow with the same reasoning written out beside it.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
