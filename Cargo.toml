[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
# A desktop tool for looking at scenes, kept out of the graph this workspace
# makes promises about. See playground/Cargo.toml for why.
exclude = ["playground"]

[workspace.package]
version = "0.2.0"
edition = "2021"
# Checked rather than asserted: the `msrv` job in `.github/workflows/ci.yml`
# builds the workspace on exactly this toolchain. It was 1.82 and untrue --
# naga is a build dependency of the shader crate and reaches indexmap, which
# moved to edition 2024 and with it to a 1.85 floor. Nothing noticed, because
# a version declared here only fails a build when a *direct* dependency asks
# for more than it.
rust-version = "1.85"
# Publishing is on by default and refused per crate, rather than the other way
# round, so that adding a crate to this workspace makes a decision visible instead
# of silently opting it out. Three say no today and each says why: `xtask`, which is
# this repository's own tooling; `emblema-testkit`, which exists to test this
# workspace and whose API is shaped by that rather than by a caller; and
# `emblema-capi`, whose artifact is a shared library for C consumers who do not use
# cargo to get it.
publish = true
# Matches the Flutter Engine, where the C++ Impeller this project takes its
# architecture from lives. Any code ported from there keeps its own copyright
# notice alongside ours.
license = "BSD-3-Clause"
repository = "https://github.com/jwinarske/emblema"
# No `homepage`. There is nowhere for it to point that a crate page does not
# already link: it held this same URL, which cargo's `redundant_homepage` lint
# warns about, and docs.rs is linked from the absent `documentation` by default.

# Dependency versions are pinned here and inherited by every member via
# `dep = { workspace = true }`, so a bump is a single reviewed edit.
#
# Hard constraint: every entry must compile from pure Rust source. No C/C++
# toolchain, cmake, or pkg-config at build time -- that property is what keeps
# cross-compilation to aarch64/riscv64 boards and containerized CI builds
# trivial, and it is enforced by the bans in deny.toml.
[workspace.lints.rust]
# Every `unsafe` block says what makes it sound, and this makes the block the
# unit that has to say it: inside an `unsafe fn`, an operation that needs
# proving is otherwise covered by the function's signature and nothing writes
# the proof down. Nine functions here are `unsafe`; two hundred blocks are.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# A library does not get to end its caller's process. The panic surface was
# audited once and came back clean -- thirty-three sites in non-test code,
# every one a local invariant of the shape "handled above" or "just created" --
# and nothing kept it that way. These four keep it.
#
# `expect` is allowed and `unwrap` is not, which is the whole distinction: an
# invariant that cannot be violated is worth stating, and stating it is what
# `expect` is. A bare `unwrap` is the same claim with the reason left out.
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
# --- rendering ---
ash = "0.38"
gpu-allocator = "0.27"
glow = "0.14"
# NEVER enable the "static" feature: it requires libEGL plus pkg-config at link
# time, which breaks clean cross-builds. "dynamic" dlopens libEGL at runtime.
khronos-egl = { version = "6", features = ["dynamic"] }
# `DisplayTarget::Gbm` dlopens libgbm for two symbols, for the same reason
# khronos-egl is "dynamic": linking it would need libgbm and pkg-config at
# link time and break clean cross-builds.
libloading = "0.8"

# --- presentation ---
raw-window-handle = "0.6"
ash-window = "0.13"

# --- core ---
lyon_tessellation = "1.0.21"
# Ear clipping, for the single-contour fast path in `emblema-geometry`'s
# tessellator. ISC, which `deny.toml` already allows. Chosen over a general
# tessellator because its output is cheap to *verify*: see `ear_fill`.
earcutr = "0.5.0"
swash = "0.1"
glam = "0.27"
bytemuck = "1"
half = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
log = "0.4"
thiserror = "1"

# --- build ---
naga = "23"

# --- dev ---
# A matcher and assertion library modeled on GoogleTest, from Google. Adopted
# for one thing the built-in harness does not have: an assertion that records a
# failure and lets the test continue. Several tests here sweep a set of inputs
# and want every failure in the set reported, not the first -- which had been
# hand-rolled four separate times as a vector of strings.
googletest = "0.14"
proptest = "1"
# Golden images, test-only. Pure Rust (fdeflate/miniz_oxide underneath), so it
# breaks neither the no-C-toolchain rule nor cross-compilation -- and it is a
# dev-dependency, so it reaches no board binary. Raw PPM for the same images is
# about twenty times the bytes, which matters for a file regenerated whenever a
# rendering change is deliberate.
png = "0.17"
criterion = "0.5"
image = "0.25"
winit = "0.30"
cosmic-text = "0.12"
usvg = "0.43"

# --- internal ---
emblema-core = { path = "crates/emblema-core", version = "0.2.0" }
emblema-entity = { path = "crates/emblema-entity", version = "0.2.0" }
emblema-geometry = { path = "crates/emblema-geometry", version = "0.2.0" }
emblema-hal = { path = "crates/emblema-hal", version = "0.2.0" }
emblema-hal-gles = { path = "crates/emblema-hal-gles", version = "0.2.0" }
emblema-hal-vulkan = { path = "crates/emblema-hal-vulkan", version = "0.2.0" }
emblema-present = { path = "crates/emblema-present", version = "0.2.0" }
emblema-present-drm = { path = "crates/emblema-present-drm", version = "0.2.0" }
emblema-present-egl = { path = "crates/emblema-present-egl", version = "0.2.0" }
emblema-present-vk = { path = "crates/emblema-present-vk", version = "0.2.0" }
emblema-renderer = { path = "crates/emblema-renderer", version = "0.2.0" }
emblema-shaders = { path = "crates/emblema-shaders", version = "0.2.0" }
emblema-testkit = { path = "crates/emblema-testkit", version = "0.2.0" }
emblema-text = { path = "crates/emblema-text", version = "0.2.0" }

[profile.release]
lto = "thin"
codegen-units = 1

# lyon's own debug assertions are not run, and this is a decision rather than a
# convenience. Its fill tessellator has an assertion in the path it takes to
# recover from an internal error, and that assertion fires on input this
# renderer accepts on purpose -- a path whose coordinates reach
# `MAX_COORDINATE`, which `Path::is_within_tessellation_range` admits for
# reasons written out beside it. In a release build lyon recovers and returns a
# tessellation; in a debug build it panics, so the same input drew a shape in
# release and took the process down under test.
#
# Turning them off for this one package makes the two agree, which is what a
# test suite is for: the suite's job is to predict what a release build does,
# and it cannot do that while a dependency's internal invariant checks are the
# difference between them. Nothing of ours is weakened -- the hostile-input
# proptests still assert that an accepted path tessellates to finite vertices,
# which is the property that matters and is checked on the same code release
# runs.
#
# See `crates/emblema-geometry/tests/hostile.rs` for the case that found it,
# pinned there as a test of its own, and nical/lyon#963 for the report -- which
# carries a seven-point reproduction rather than that one, shrunk from it by
# deleting points while the panic held.
[profile.dev.package.lyon_tessellation]
debug-assertions = false

[profile.test.package.lyon_tessellation]
debug-assertions = false
