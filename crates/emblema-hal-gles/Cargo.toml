[package]
name = "emblema-hal-gles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "GLES 3.0 rendering backend for emblema."
keywords = ["gles", "opengl", "backend", "graphics", "hal"]
categories = ["graphics", "rendering::graphics-api"]

[lints]
workspace = true

[dependencies]
half.workspace = true
glow = { workspace = true }
emblema-hal = { workspace = true }
emblema-shaders = { workspace = true }
# "dynamic" dlopens libEGL at runtime. Never "static": that needs libEGL and
# pkg-config at link time, which breaks clean cross-builds and is banned by
# deny.toml.
khronos-egl = { workspace = true }
libloading = { workspace = true }
