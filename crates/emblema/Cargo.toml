[package]
name = "emblema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "A Flutter-class 2D renderer: Vulkan and GLES backends, WSI and DRM/KMS presentation."
keywords = ["renderer", "vulkan", "gles", "graphics", "flutter"]
categories = ["graphics", "rendering::engine"]

# The package is `emblema` because `impeller` on crates.io is an unrelated
# crate that got there first. The library keeps the plain name, so a consumer
# writes `use emblema::...` either way and only the dependency line differs.
[lib]
name = "emblema"

# `drm` is presentation-only and composes with either rendering backend:
#   --features vulkan,drm       Vulkan rendering with KMS scanout
#   --features gles,drm         the classic embedded GBM path
#   --features vulkan,gles,drm  one binary that picks at runtime
# docs.rs builds with default features, which here are Vulkan and its swapchain
# -- so the GLES backend, the DRM presentation path and the EGL one would be
# absent from the documentation of the one crate a reader is most likely to open.
# The whole surface is documented instead. It builds and documents clean with
# every feature at once, which the gate's feature matrix does not check on its
# own: that walks combinations one at a time.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["vulkan", "present-wsi"]
vulkan = ["dep:emblema-hal-vulkan"]
gles = ["dep:emblema-hal-gles"]
drm = ["dep:emblema-present-drm"]
# A presentation path and a rendering backend are orthogonal axes, and `drm` is
# the proof: it names no backend and composes with either. These two are not
# counter-examples to that. A Vulkan swapchain is Vulkan's own object and an EGL
# surface is GLES's, so each implies the backend whose API it belongs to --
# which is a property of those window systems rather than of this arrangement.
present-wsi = ["vulkan", "dep:emblema-present-vk"]
present-egl = ["gles", "dep:emblema-present-egl"]

[dev-dependencies]
half.workspace = true
googletest = { workspace = true }
proptest = { workspace = true }
# This crate, on itself, to turn on the second backend its own tests compare.
# The default feature set is one backend, which is right for a consumer on a
# board that has one -- but three tests here need two contexts of different
# kinds, and with only one compiled in they report themselves skipped and pass.
# A skip that reports success is indistinguishable from a pass, so the tests
# had been silently absent since they were written. Enabling the feature here
# rather than asking for a flag is what makes them run under a plain
# `cargo test`, which is the only kind that gets run.
emblema = { path = ".", features = ["gles"] }

[lints]
workspace = true

[dependencies]
emblema-core = { workspace = true }
emblema-hal = { workspace = true }
emblema-shaders = { workspace = true }
emblema-present = { workspace = true }
emblema-hal-vulkan = { workspace = true, optional = true }
emblema-hal-gles = { workspace = true, optional = true }
emblema-present-drm = { workspace = true, optional = true }
emblema-present-vk = { workspace = true, optional = true }
emblema-present-egl = { workspace = true, optional = true }
