[package]
name = "emblema-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Render pass encoding for emblema, generic over the rendering HAL."
keywords = ["renderer", "graphics", "render-pass", "2d"]
categories = ["graphics", "rendering"]

[lints]
workspace = true

[dependencies]
glam = { workspace = true }
emblema-geometry = { workspace = true }
emblema-hal = { workspace = true }

[dev-dependencies]
# A concrete backend is needed to check that geometry lands on the pixels it
# should. This is a test-only dependency; the renderer itself stays generic.
emblema-hal-vulkan = { path = "../emblema-hal-vulkan" }
# Generated transforms, for the two steps the tessellator's own property tests
# cannot reach: the tolerance a transform decides, and the clip-space
# conversion after it.
proptest = { workspace = true }
