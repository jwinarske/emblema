[package]
name = "emblema-present-drm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "DRM/KMS direct-scanout presentation target for emblema."
keywords = ["drm", "kms", "scanout", "embedded", "display"]
categories = ["graphics", "embedded"]

[lints]
workspace = true

[dependencies]
drm = { version = "0.15.0", default-features = false }
# GBM allocation for the path this crate has named since it was written: where
# the renderer cannot allocate its own scanout buffers, GBM allocates and the
# renderer imports. `default-features = false` drops `drmkit-core`, which would
# bring a second `drm` surface this crate already has its own view of -- and is
# why `GbmDevice::from_fd` exists. Opens libgbm at run time, so this stays a
# pure-Rust build with no pkg-config and no C toolchain, which `deny.toml`
# requires of every dependency.
drmkit-gbm = { version = "0.1.1", default-features = false }
emblema-core = { workspace = true }
emblema-hal = { workspace = true }
emblema-present = { workspace = true }
log = { workspace = true }
rustix = { version = "1.1.4", default-features = false, features = ["fs"] }

[dev-dependencies]
emblema-hal-vulkan = { path = "../emblema-hal-vulkan" }
# `Image`, `compare` and the calibrated tolerances, so the writeback comparison
# reports a difference the way every other comparison here does. Path-only and
# with no version, like the line above, so `cargo publish` drops it.
emblema-testkit = { path = "../emblema-testkit" }
# `writeback.rs` waits on the fence the kernel hands back, and a sync_file is
# told it signaled by polling it.
rustix = { version = "1.1.4", default-features = false, features = ["event", "mm"] }
# `read-the-export`, which allocates and fills with no renderer in it so that
# "our code is contributing" is not one of the possibilities.
ash = { workspace = true }
# The `IN_FORMATS` parser reads the kernel's bytes at offsets it computes
# itself, which is the shape a generator explores better than a table.
proptest = { workspace = true }
