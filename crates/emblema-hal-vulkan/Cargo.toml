[package]
name = "emblema-hal-vulkan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Vulkan rendering backend for emblema."
keywords = ["vulkan", "backend", "graphics", "renderer", "hal"]
categories = ["graphics", "rendering::graphics-api"]

[lints]
workspace = true

[dependencies]
ash = { workspace = true }
gpu-allocator = { workspace = true }
emblema-hal = { workspace = true }
emblema-shaders = { workspace = true }

[dev-dependencies]
# `probe-the-composite-rule` builds its own variants rather than carrying
# pre-translated blobs, so what each one contains is readable in the file.
naga = { workspace = true, features = ["wgsl-in", "spv-out"] }
emblema-present = { path = "../emblema-present" }
rustix = { version = "1.1.4", default-features = false, features = ["event", "std"] }
